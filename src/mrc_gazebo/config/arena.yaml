# Single source of truth for the coverage arena.
# scripts/generate_arena.py turns this into BOTH the Gazebo world (worlds/*.sdf)
# and the Nav2 occupancy map (maps/*.pgm + *.yaml), so they can never drift apart.
name: coverage_arena
interior: {x_min: -5.0, x_max: 5.0, y_min: -4.0, y_max: 4.0}   # metres, inside face of walls
wall: {thickness: 0.15, height: 0.6}
map: {resolution: 0.05, margin: 0.5}   # margin = unknown border around the outer walls
# Obstacles keep the central band |y| < 1.7 free for the formation route.
boxes:        # [name, cx, cy, size_x, size_y, height]
  - [crate_nw,   -3.0,  2.7, 1.2, 0.8, 0.6]
  - [crate_ne,    2.9,  2.8, 0.8, 1.2, 0.6]
  - [divider_n,   0.4,  3.0, 0.15, 2.0, 0.6]
  - [bench_s,     1.4, -2.9, 1.4, 0.6, 0.6]
cylinders:    # [name, cx, cy, radius, height]
  - [pillar_sw,  -2.4, -2.7, 0.35, 0.8]
  - [pillar_se,   3.9, -2.6, 0.30, 0.8]
  - [pillar_n,   -0.9,  2.4, 0.25, 0.8]
